<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Biblioteca Alejandría</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --card: #0f3460;
      --accent: #e94560;
      --accent2: #f5a623;
      --text: #eaeaea;
      --muted: #8892a4;
      --border: #1e3a5f;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, var(--surface) 0%, var(--card) 100%);
      border-bottom: 2px solid var(--accent);
      padding: 2rem 2rem 1.5rem;
      text-align: center;
    }

    header h1 {
      font-size: 2.2rem;
      letter-spacing: 0.04em;
      color: var(--text);
    }

    header h1 span {
      color: var(--accent);
    }

    header p {
      margin-top: 0.4rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.2rem 2rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .toolbar input {
      flex: 1;
      min-width: 200px;
      padding: 0.5rem 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .toolbar input:focus {
      border-color: var(--accent);
    }

    .toolbar input::placeholder {
      color: var(--muted);
    }

    #count {
      color: var(--muted);
      font-size: 0.9rem;
      white-space: nowrap;
    }

    main {
      padding: 1.5rem 2rem;
    }

    .table-wrapper {
      overflow-x: auto;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      font-size: 0.95rem;
    }

    thead th {
      background: var(--card);
      padding: 0.85rem 1.2rem;
      text-align: left;
      font-weight: 600;
      color: var(--accent2);
      letter-spacing: 0.04em;
      font-size: 0.85rem;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      border-bottom: 2px solid var(--border);
      transition: color 0.15s;
    }

    thead th:hover { color: var(--accent); }

    thead th .sort-icon { margin-left: 0.3rem; opacity: 0.5; }
    thead th.sorted .sort-icon { opacity: 1; color: var(--accent); }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(233, 69, 96, 0.07); }

    td {
      padding: 0.8rem 1.2rem;
      vertical-align: middle;
    }

    td.name {
      font-weight: 500;
      word-break: break-word;
      max-width: 420px;
    }

    td.name .icon {
      margin-right: 0.5rem;
      font-size: 1.1rem;
    }

    td.size {
      color: var(--muted);
      white-space: nowrap;
    }

    td.actions { white-space: nowrap; }

    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.38rem 0.85rem;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-download:hover {
      background: #c73652;
      transform: translateY(-1px);
    }

    /* States */
    #state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
      gap: 1rem;
      color: var(--muted);
      text-align: center;
    }

    #state .spinner {
      width: 44px; height: 44px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #state .emoji { font-size: 2.5rem; }
    #state p { font-size: 1rem; max-width: 400px; }
    #state a { color: var(--accent); }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--muted);
      font-size: 0.8rem;
      border-top: 1px solid var(--border);
      margin-top: 2rem;
    }

    @media (max-width: 600px) {
      header h1 { font-size: 1.5rem; }
      main { padding: 1rem; }
      .toolbar { padding: 0.8rem 1rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>📚 Biblioteca <span>Alejandría</span></h1>
  <p>Colección de libros en formato ePub</p>
</header>

<div class="toolbar">
  <input type="search" id="search" placeholder="🔍  Buscar libro..." />
  <span id="count"></span>
</div>

<main>
  <div id="state">
    <div class="spinner"></div>
    <p>Cargando catálogo…</p>
  </div>

  <div class="table-wrapper" id="table-wrapper" style="display:none">
    <table>
      <thead>
        <tr>
          <th data-col="name">Título <span class="sort-icon">↕</span></th>
          <th data-col="size">Tamaño <span class="sort-icon">↕</span></th>
          <th>Descargar</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>

<footer>
  Biblioteca Alejandría &mdash; Repositorio en
  <a href="https://github.com/PabloBrion/BibliotecaAlejandria" target="_blank" style="color:var(--accent)">GitHub</a>
</footer>

<script>
  // ─── CONFIGURACIÓN ───────────────────────────────────────────────────────────
  const OWNER  = 'PabloBrion';
  const REPO   = 'BibliotecaAlejandria';
  const FOLDER = 'Libros';
  // ─────────────────────────────────────────────────────────────────────────────

  const API_URL = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}`;

  let allBooks = [];
  let sortCol  = 'name';
  let sortAsc  = true;

  function formatSize(bytes) {
    if (bytes === null || bytes === undefined) return '—';
    if (bytes < 1024)       return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
  }

  function cleanName(filename) {
    return filename.replace(/\.epub$/i, '');
  }

  function renderTable(books) {
    const tbody = document.getElementById('tbody');
    const count = document.getElementById('count');

    if (!books.length) {
      tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;padding:2rem;color:var(--muted)">Sin resultados</td></tr>`;
      count.textContent = '0 libros';
      return;
    }

    count.textContent = `${books.length} libro${books.length !== 1 ? 's' : ''}`;

    tbody.innerHTML = books.map(b => `
      <tr>
        <td class="name"><span class="icon">📖</span>${cleanName(b.name)}</td>
        <td class="size">${formatSize(b.size)}</td>
        <td class="actions">
          <a class="btn-download" href="${b.download_url}" download="${b.name}">
            ⬇ Descargar
          </a>
        </td>
      </tr>
    `).join('');
  }

  function applyFilters() {
    const q = document.getElementById('search').value.toLowerCase().trim();
    let filtered = allBooks.filter(b =>
      cleanName(b.name).toLowerCase().includes(q)
    );

    filtered = filtered.sort((a, b) => {
      let va = sortCol === 'size' ? (a.size || 0) : cleanName(a.name).toLowerCase();
      let vb = sortCol === 'size' ? (b.size || 0) : cleanName(b.name).toLowerCase();
      if (va < vb) return sortAsc ? -1 : 1;
      if (va > vb) return sortAsc ?  1 : -1;
      return 0;
    });

    renderTable(filtered);
  }

  function setState(type, msg = '') {
    const stateEl  = document.getElementById('state');
    const tableEl  = document.getElementById('table-wrapper');

    if (type === 'loading') {
      stateEl.innerHTML  = `<div class="spinner"></div><p>${msg}</p>`;
      stateEl.style.display  = 'flex';
      tableEl.style.display  = 'none';
    } else if (type === 'error') {
      stateEl.innerHTML  = `<span class="emoji">⚠️</span><p>${msg}</p>`;
      stateEl.style.display  = 'flex';
      tableEl.style.display  = 'none';
    } else if (type === 'empty') {
      stateEl.innerHTML  = `<span class="emoji">📭</span><p>${msg}</p>`;
      stateEl.style.display  = 'flex';
      tableEl.style.display  = 'none';
    } else {
      stateEl.style.display  = 'none';
      tableEl.style.display  = 'block';
    }
  }

  async function loadBooks() {
    setState('loading', 'Cargando catálogo…');
    try {
      const resp = await fetch(API_URL);

      if (resp.status === 404) {
        setState('error', `No se encontró la carpeta <strong>/${FOLDER}</strong> en el repositorio. ¿Ya subiste los archivos?`);
        return;
      }
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        if (err.message && err.message.includes('rate limit')) {
          setState('error', 'Límite de consultas de GitHub alcanzado. Intentá de nuevo en unos minutos.');
        } else {
          setState('error', `Error al consultar GitHub: ${resp.status} ${resp.statusText}`);
        }
        return;
      }

      const files = await resp.json();
      allBooks = files
        .filter(f => f.type === 'file' && f.name.toLowerCase().endsWith('.epub'))
        .sort((a, b) => cleanName(a.name).localeCompare(cleanName(b.name), 'es', { sensitivity: 'base' }));

      if (!allBooks.length) {
        setState('empty', `La carpeta <strong>/${FOLDER}</strong> existe pero no tiene archivos .epub todavía.`);
        return;
      }

      setState('ready');
      applyFilters();

    } catch (e) {
      setState('error', 'No se pudo conectar con GitHub. Verificá tu conexión a internet.');
      console.error(e);
    }
  }

  // ─── Eventos ─────────────────────────────────────────────────────────────────
  document.getElementById('search').addEventListener('input', applyFilters);

  document.querySelectorAll('thead th[data-col]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (sortCol === col) {
        sortAsc = !sortAsc;
      } else {
        sortCol = col;
        sortAsc = true;
      }
      document.querySelectorAll('thead th').forEach(t => t.classList.remove('sorted'));
      th.classList.add('sorted');
      th.querySelector('.sort-icon').textContent = sortAsc ? '↑' : '↓';
      applyFilters();
    });
  });

  // ─── Init ─────────────────────────────────────────────────────────────────────
  loadBooks();
</script>

</body>
</html>
